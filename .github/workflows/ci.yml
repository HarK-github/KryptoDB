name: KryptoDB CI

on:
  push:
    branches: [main, master, "audit-*"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      neo4j:
        image: neo4j:5.21.2-community
        env:
          NEO4J_AUTH: neo4j/kryptodb_ci_password
        ports:
          - 7474:7474
          - 7687:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p kryptodb_ci_password 'RETURN 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      KRYPTODB_ENV: production
      KRYPTODB_ADMIN_API_KEY: ci-admin-secret-key
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: kryptodb_ci_password
      REDIS_URL: redis://localhost:6379/0

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv and dependencies
        run: |
          pip install uv
          uv pip install --system -e ".[embeddings]" import-linter pytest pytest-asyncio httpx

      - name: Check hexagonal architecture import contracts
        run: lint-imports

      - name: Run full unit & security gate suites
        run: |
          pytest tests/unit/security/test_p0_security_and_correctness.py \
                 tests/unit/security/test_step1_unified_access_control.py \
                 tests/unit/memory/test_step2_step3_semantics.py \
                 tests/unit/crypto/test_encrypted_phase1.py \
                 tests/unit/crypto/test_encrypted_phase2.py \
                 tests/unit/crypto/test_encrypted_phase3.py

      - name: Run live Neo4j E2E & full test suite
        run: pytest -q
