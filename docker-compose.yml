version: '3.8'
services:
  neo4j:
    image: neo4j:5.21.2-community
    ports:
      - "7474:7474" # HTTP Browser
      - "7687:7687" # Bolt Driver
    environment:
      - NEO4J_AUTH=neo4j/password
      # Allow APOC/vector indexing if needed later
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - neo4j_data:/data

  redis:
    image: redis:7.4-alpine
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data

volumes:
  neo4j_data:
  redis_data:
